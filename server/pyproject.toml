[project]
name = "introspect"
version = "0.1.0"
description = "Archive + reading room for Claude Code session transcripts"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # TUI framework (§16). Pure-Python, no native deps, actively maintained, the de-facto
    # Python TUI standard; lazy-imported inside the `introspect tui` verb so cron `import`
    # never pays its cost.
    "textual>=0.60",
]

[project.scripts]
introspect = "introspect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "httpx2>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/introspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
